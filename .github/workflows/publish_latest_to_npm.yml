name: Publish Latest to NPM

on:
  workflow_call:
    secrets:
      TONEFLIX_RELEASE_TOKEN:
        required: true
      NPM_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  deploy-npm-latest:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.TONEFLIX_RELEASE_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TONEFLIX_RELEASE_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Set Node.js 22.x
        uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org/
          node-version: 22
          cache: 'pnpm'

      - name: Add token to NPMRC
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc

      - name: Test NPM Authentication
        run: pnpm whoami

      - name: Configure git identity
        run: |
          git config user.name "Github Workflow (on behalf of ${{ github.actor }})"
          git config user.email "users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build for publishing
        run: pnpm build

      - name: Format build
        run: pnpm fmt

      - name: Commit release prep back to main
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Working tree clean, nothing to sync."
            exit 0
          fi
          git status --short
          git commit -m "chore: sync lockfile and formatting ahead of release [skip ci]"
          git push origin HEAD:main

      - name: Version & Publish
        run: pnpm run ci:publish:latest
